# Mosquitto 配置（仅全局域网匿名本地连接，不设账号、不暴露公网）
# 粘到：deploy/mosquitto/mosquitto.conf（与 docker-compose.yml 挂载路径对应）

# 监听 1883，绑定所有网卡（局域网内 Python 脚本可连）
listener 1883

# 本地 MVP 先允许匿名；以后要加密码，改用 password_file + 关闭匿名
allow_anonymous true

# 持久化与日志
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
