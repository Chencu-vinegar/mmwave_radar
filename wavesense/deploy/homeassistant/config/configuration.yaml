# Home Assistant 配置（WaveSense MVP）
# 放置位置：本文件映射到容器 /config/configuration.yaml
# 首次启动：浏览器打开 http://localhost:8123 建账号
#
# 灯：飞利浦 WiZ 全彩智能灯泡（WiFi，无网关）。
# 接入步骤见 deploy/README.md「WiZ 灯泡接入」一节。
# 接入后：在 设置 → 设备与服务 → WiZ 下查看灯泡实体名（形如 light.wiz_bulb_xxx），
# 把本文件下方自动化里两处 light.placeholder_light 引用替换成该实体名，
# 并可删除下面 light: 下的占位 template 段。

# MQTT broker（同一 compose 网络内用服务名 mosquitto）
mqtt:
  broker: mosquitto
  port: 1883

# 房间有人（接 Python 发布的 wavesense/room1/presence）
binary_sensor:
  - platform: mqtt
    name: "房间有人"
    object_id: room_presence          # 实体固定为 binary_sensor.room_presence
    unique_id: wavesense_room_presence
    state_topic: "wavesense/room1/presence"
    payload_on: "1"
    payload_off: "0"
    device_class: occupancy
    qos: 1

# 人数（当前等于 presence：0/1；双人计数为后续）
sensor:
  - platform: mqtt
    name: "人数"
    object_id: people_count          # 实体固定为 sensor.people_count
    unique_id: wavesense_people_count
    state_topic: "wavesense/room1/people_count"

# 延时关灯计时器；时长对应 config.yaml 的 light_off_delay_sec
timer:
  light_off:
    name: "延时关灯"
    duration: "00:05:00"

# 灯占位：未接真实灯时用日志模拟开关，便于先验证自动化链路。
# 接入 WiZ 灯泡后，把自动化里两处 light.placeholder_light 引用换成真实实体名，
# 然后可删除本段占位 template。
light:
  - platform: template
    lights:
      placeholder_light:
        friendly_name: "占位灯（替换为 WiZ 灯泡实体）"
        turn_on:
          service: logbook.log
          data:
            name: WaveSense
            message: "占位灯：开"
        turn_off:
          service: logbook.log
          data:
            name: WaveSense
            message: "占位灯：关"

automation:
  # 有人 → 立即开灯，并取消尚未到点的关灯
  - alias: "有人_开灯并取消关灯"
    trigger:
      - platform: state
        entity_id: binary_sensor.room_presence
        to: "on"
    action:
      - service: timer.cancel
        target:
          entity_id: timer.light_off
      - service: light.turn_on
        target:
          entity_id: light.placeholder_light   # TODO: 替换为 WiZ 灯泡实体名
        # 小夜灯可选：开灯时给低亮度暖光（白天正常照明可删掉 brightness/color_temp）
        # data:
        #   brightness_pct: 15
        #   color_temp: 2700

  # 无人 → 启动延时关灯
  - alias: "无人_启动延时关灯"
    trigger:
      - platform: state
        entity_id: binary_sensor.room_presence
        to: "off"
    action:
      - service: timer.start
        target:
          entity_id: timer.light_off

  # 延时到 → 关灯
  - alias: "延时到_关灯"
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.light_off
    action:
      - service: light.turn_off
        target:
          entity_id: light.placeholder_light   # TODO: 替换为 WiZ 灯泡实体名

# 记录历史与日志（默认 SQLite 存储，用于 Logbook 与 24h 进出记录）
recorder:
  db_url: sqlite:///config/home-assistant_v2.db
logbook:
