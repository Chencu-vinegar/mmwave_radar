# ============================================================
# WaveSense 全局配置
# 说明：运动阈值已按 B1 重采样本实测校准（2026-10-29）；静坐相关参数仍为占位，
# B2 回放链路复核后再定。代码里不允许出现阈值硬编码，所有可调参数都放在本文件。
# ============================================================

# ---------- 运动存在判定（A3 实现） ----------

# 能量阈值：一帧内“超过底噪的距离门能量之和”大于此值，该帧判为“有人候选”。
# B1 实测（2026-10-29 重采样本，门0直流已剔除）：空房 P99=32.34，走动 P50=74.24，
# 取区间中点 53.0；静坐 P50=19.29 < 32，不会误触发运动路径。
energy_threshold: 53.0

# 单门底噪估计：门能量超过它的部分才计入“超底噪能量”。
# B1 实测：去空房底噪后基准为 0，置 0.0。
noise_floor: 0.0

# 是否把门 0 当作直流自杂波门剔除（授权软件界面“排除直流 bin0”勾选的对应项）。
# 门 0 是近场直流自杂波，人在 0.5m 附近的回波会被淹没；统计和判定时不计入它。
exclude_dc_bin0: true

# 进入去抖帧数：连续 N 帧都是“有人候选”，presence 才从 0 翻成 1（防止抖动亮灯）。
debounce_frames_enter: 3

# 离开去抖帧数：连续 N 帧都“无人候选”，presence 才从 1 翻成 0。
# 离开去抖通常比进入长，避免人轻微停顿被误判为空房而提前灭灯。
debounce_frames_leave: 8

# ---------- 静坐判定（A3b 再启用，先占位） ----------

# 静坐稳定方差上限：滑动窗口内 range_energy 整体方差低于此值，视为“能量稳定”。
still_energy_variance: 0.05

# 距离门持续占用帧数：某个距离门持续高于底噪达到 N 帧，视为“静坐占用”。
still_persist_frames: 60

# 静坐判定滑动窗口长度（帧数），A3b 实现静坐逻辑时使用，先占位。
still_window_frames: 90

# 静坐“占用线”：某距离门能量持续超过它才算被静坐占用（占位，B1 校准）。
still_gate_min_energy: 0.5

# ---------- MQTT（A4 实现） ----------

# 本地 Mosquitto broker 地址，全本地运行，不填公网地址。
mqtt_host: 127.0.0.1

# Mosquitto 默认端口。
mqtt_port: 1883

# presence(0/1) 发布主题。
mqtt_topic_presence: wavesense/room1/presence

# people_count(0/1/2) 发布主题。
mqtt_topic_people_count: wavesense/room1/people_count

# ---------- 模拟数据源（A2，仅无硬件时开发测试用，不进演示链路） ----------

# 合成场景：empty=空房 / walk=有人走动 / sit=有人静坐
sim_scene: walk

# 模拟帧率（帧/秒）。B0 实测真实帧速 = 10 fps，与之一致。
sim_frame_rate: 10.0

# 合成距离门数。B0 实测真实门数 = 8（探测范围 0~5.65m，门分辨率约 0.71m/门）。
sim_num_gates: 8

# 生成多少帧后结束；0 表示无限循环（一般不用）。
sim_frames: 60

# ---------- 串口（B2 实时阶段使用，现在先记录 B0 实测值；pyserial 届时再装） ----------

# B0 实测：CP210x 转接，串口 COM5，波特率 921600。
serial_port: COM5
serial_baud: 921600
# 数据位/校验/停止位待用户手册确认（暂留默认，B2 拼帧前核对）。

# ---------- HA 灯控（A5 配置使用） ----------

# presence 翻为 0 后延时多少秒关灯（由 HA 自动化执行，Python 只负责发状态）。
light_off_delay_sec: 300
