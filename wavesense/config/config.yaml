# WaveSense 存在检测参数（基于 DEV202 直接串口数据标定，2026-10-22）
# 能量单位：两通道 int16 平方和；窗口为逻辑帧（约 480 fps）
#
# 直接串口（不经过授权软件）时，静坐的距离门短窗是"周期性稀疏尖峰"：
#   空房稳态 距离门短窗约 5-6e8（最大约 1.15e9），动作区约 9e7；
#   静坐     活动尖峰约 3-5e9，尖峰间隔最长约 10852 帧（约 22s）；
#   明显动作 动作区短窗约 1.5-2e9。

detector:
  short_window: 30        # 短窗：活动判据 + 动作分级

  # 活动判据：短窗距离门（空房最大约 1.15e9，静坐尖峰约 3-5e9）
  active_threshold: 1.2e9
  enter_frames: 5         # 连续超阈值多少帧才进入

  # 近门电器过滤：短窗尖峰必须有该比例能量传播到远门（门4-5）。
  # 近门电器（饮水机/风扇）尖峰远门比例 <0.05；人呼吸多径传播，通常 >=0.1。
  far_gate_ratio: 0.05

  # 离开：连续无活动尖峰多少帧（静坐最长间隔约 10852，取 12000，约 25s）
  leave_gap_frames: 12000

  # 动作分级（短窗动作区，有人时才用；纯数据集标定，2026-10-23）
  # 动作区短窗：空房/静坐约 5-7e7（95% 约 3e8），小动中位约 1.5e9，大动中位约 4.3e9
  small_move_threshold: 4.0e8   # 静坐呼吸（约 3e8 以下）与小动（约 5.6e8 起）
  large_move_threshold: 2.6e9   # 小动（多数 2.5e9 以下）与大动（约 2.5e9 起）

  # 走动保持（窄房间来回走动，2026-10-30 标定）
  # 转身进入角度盲区时当下动作门回落，用记忆窗口内"强动作帧数"保持大动。
  # 纯静坐强动作帧数恒为 0，走动 7 秒窗内强动作帧数足够（98% 识别）。
  walk_window: 3360             # 记忆窗口（约 7s，略大于转身低谷 5-6s）
  walk_strong_threshold: 2.0e9  # 强动作门阈值
  walk_strong_frames: 20        # 窗口内强动作帧数达到即判大动

# MQTT 本地 broker（与 HA 同机或局域网）
mqtt:
  host: localhost
  port: 1883
  topic: wavesense/room1

# 灯控：presence 从 1 变 0 后延时多少秒关灯（演示时可临时调小）
light_off_delay_sec: 300
